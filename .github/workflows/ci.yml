name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout browsermesh-primitives
        uses: actions/checkout@v4
        with:
          repository: johnhenry/browsermesh-primitives
          path: deps/browsermesh-primitives

      - name: Checkout browsermesh-netway
        uses: actions/checkout@v4
        with:
          repository: johnhenry/browsermesh-netway
          path: deps/browsermesh-netway

      - name: Checkout browsermesh-pod
        uses: actions/checkout@v4
        with:
          repository: johnhenry/browsermesh-pod
          path: deps/browsermesh-pod

      - name: Checkout wsh-upon-star
        uses: actions/checkout@v4
        with:
          repository: johnhenry/wsh-upon-star
          path: deps/wsh-upon-star

      - name: Checkout andbox
        uses: actions/checkout@v4
        with:
          repository: johnhenry/andbox
          path: deps/andbox

      - name: Checkout ai-matey-middleware-andbox
        uses: actions/checkout@v4
        with:
          repository: johnhenry/ai-matey-middleware-andbox
          path: deps/ai-matey-middleware-andbox

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Rewrite file: references to point to deps/ checkout paths
      - name: Rewrite dependency paths for CI
        run: |
          sed -i 's|file:../browsermesh-primitives|file:deps/browsermesh-primitives|g' package.json
          sed -i 's|file:../browsermesh-netway|file:deps/browsermesh-netway|g' package.json
          sed -i 's|file:../browsermesh-pod|file:deps/browsermesh-pod|g' package.json
          sed -i 's|file:../wsh-upon-star|file:deps/wsh-upon-star|g' package.json
          sed -i 's|file:../andbox|file:deps/andbox|g' package.json
          sed -i 's|file:../ai-matey-middleware-andbox|file:deps/ai-matey-middleware-andbox|g' package.json

      - run: npm install
      - run: npm test
